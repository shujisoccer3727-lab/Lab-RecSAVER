seed: 20260808
data:
  processed_path: data/processed/rater_essay_wide.csv
experiment:
  num_targets: 10
  history_size: 5
  history_strategy: random
  num_reference_candidates: 3
  target_raters: []
  prediction_mode: reasoning
  max_parse_retries: 1
model:
  model_id: Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
  quantization: gptq_marlin
  tensor_parallel_size: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.90
generation:
  prediction: {temperature: 0.2, top_p: 0.8, max_tokens: 384}
  reference: {temperature: 0.7, top_p: 0.8, max_tokens: 384}
  verification: {temperature: 0.01, top_p: 0.8, max_tokens: 64}
context:
  approximate_chars_per_token: 3.0
  reserved_output_tokens: 384
output_dir: outputs/recsaver_mvp

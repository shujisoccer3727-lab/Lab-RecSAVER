experiment_name: reasoning_eval_v1
seed: 20260814
num_targets: 100
history_size: 3
num_reference_candidates: 3
max_reference_retries: 5
# At most five attempts per candidate slot, including the initial attempt.
max_verification_parse_retries: 1
batch_size: 10
rubric_path: rubrics/ellipse_overall_rubric.md
reference_prompt: prompts/en/reference_generation_rubric.txt
self_verification_prompt: prompts/en/self_verification_rubric.txt
prediction_prompt: prompts/en/rubric_based_prediction.txt
prediction_source: outputs/overall_rubric_ablation
source_metadata: outputs/overall_rubric_ablation/metadata.json
source_predictions: outputs/overall_rubric_ablation/overall_rubric_predictions.jsonl
history_metadata: outputs/history_ablation/metadata.json
history_predictions: outputs/history_ablation/history_ablation_predictions.jsonl
data:
  processed_path: data/processed/rater_essay_wide.csv
model:
  model_id: Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
  quantization: gptq_marlin
  tensor_parallel_size: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.90
generation:
  reference: {temperature: 0.2, top_p: 0.8, max_tokens: 384}
  verification: {temperature: 0.2, top_p: 0.8, max_tokens: 64}
metrics:
  bertscore_model: roberta-large
  bertscore_layers: 17
  bertscore_idf: false
  bertscore_rescale_with_baseline: false
  bertscore_use_fast_tokenizer: false
  batch_size: 16
  device: cuda
output_dir: outputs/reasoning_eval_v1
